name: Build APK from zip

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract Android project zip
        shell: bash
        run: |
          ls -la
          if [ -f smart-plant-guardian-repaired-source.zip ]; then
            unzip -o smart-plant-guardian-repaired-source.zip -d .
          elif [ -f smart-plant-guardian-configured.zip ]; then
            unzip -o smart-plant-guardian-configured.zip -d .
          else
            echo "No zip file found in repo root."
            exit 1
          fi

          echo "Files after unzip:"
          find . -maxdepth 3 -name gradlew -o -name build.gradle -o -name settings.gradle | head -n 50

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -name gradlew -type f | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No Android project with gradlew found."
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Make gradlew executable
        shell: bash
        run: |
          chmod +x "${{ steps.project.outputs.project_dir }}/gradlew"

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"
          ./gradlew assembleDebug

      - name: Rename APK to custom name
        shell: bash
        run: |
          APK_PATH=$(find "${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK generated."
            exit 1
          fi
          cp "$APK_PATH" "$GITHUB_WORKSPACE/smart plant guardian.apk"
          ls -l "$GITHUB_WORKSPACE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-plant-guardian
          path: "smart plant guardian.apk"
